[project]
name = "mlops-2"
version = "0.1.0"
description = ""
authors = [
    {name = "EthanChmt",email = "ethan.chaumeret@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "streamlit (>=1.57.0,<2.0.0)",
    "mlflow (>=3.12.0,<4.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "python-multipart (>=0.0.29,<0.0.30)",
    "huggingface-hub (>=1.16.1,<2.0.0)",
    "pandas (<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "gradio (>=6.15.2,<7.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "onnxmltools (>=1.16.0,<2.0.0)",
    "onnxruntime (>=1.26.0,<2.0.0)",
    "skl2onnx (>=1.20.0,<2.0.0)",
    "evidently (==0.4.40)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]
